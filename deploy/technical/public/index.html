<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Металлик и Ко — онлайн-консультант</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef1f3;color:#252a2e}.shell{min-height:100vh;display:grid;place-items:center;padding:20px}.chat{width:min(100%,470px);height:min(760px,calc(100vh - 40px));display:flex;flex-direction:column;overflow:hidden;border-radius:18px;background:#fff;box-shadow:0 24px 70px #17202726}.head{display:flex;align-items:center;gap:12px;padding:18px;color:#fff;background:#252a2e}.logo{display:grid;place-items:center;width:40px;height:40px;font-weight:900;background:#e76126}.head strong,.head span{display:block}.head span{margin-top:3px;color:#aeb8be;font-size:12px}.online{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#50bd7a}.messages{flex:1;overflow:auto;padding:20px;background:#f5f6f7}.msg{max-width:82%;margin:0 0 12px;padding:11px 13px;border-radius:12px 12px 12px 3px;background:#fff;box-shadow:0 1px 4px #18202510;font-size:14px;line-height:1.45}.mine{margin-left:auto;border-radius:12px 12px 3px 12px;color:#fff;background:#e35f25}.quick{display:flex;gap:7px;flex-wrap:wrap;margin:5px 0 15px}.quick button{border:1px solid #edb99f;border-radius:18px;padding:7px 10px;color:#c95220;background:#fff;cursor:pointer}.form{padding:12px;border-top:1px solid #e1e4e6}.contact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}input{width:100%;border:1px solid #d9dde0;border-radius:8px;padding:11px;font-size:14px}.send{display:grid;grid-template-columns:1fr auto;gap:8px}.send button{border:0;border-radius:8px;padding:0 17px;color:#fff;background:#e35f25;cursor:pointer}.legal{margin:8px 2px 0;color:#8a9195;font-size:10px;line-height:1.35}@media(max-width:500px){.shell{padding:0}.chat{height:100vh;border-radius:0}.contact{grid-template-columns:1fr}}
</style></head><body><main class="shell"><section class="chat"><header class="head"><div class="logo">М</div><div><strong>Металлик и Ко</strong><span>Онлайн-консультант</span></div><i class="online"></i></header><div class="messages" id="messages"><div class="msg">Здравствуйте! Помогу подобрать продукцию и оформить заявку. Что вас интересует?</div><div class="quick"><button>Профнастил</button><button>Дымоход</button><button>Водосток</button><button>Металлочерепица</button></div></div><form class="form" id="form"><div class="contact"><input id="name" autocomplete="name" placeholder="Ваше имя"><input id="contact" autocomplete="tel" placeholder="Телефон (предпочтительно)"></div><div class="send"><input id="message" required maxlength="2000" placeholder="Напишите сообщение…"><button>Отправить</button></div><p class="legal">Можно указать телефон, e-mail или Telegram в сообщении. Нажимая «Отправить», вы соглашаетесь на обработку данных для ответа на обращение. Техническая версия.</p></form></section></main><script>
const form=document.querySelector('#form'),messages=document.querySelector('#messages'),input=document.querySelector('#message');const sessionId=localStorage.metallikSessionId||(localStorage.metallikSessionId=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()));document.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});const add=(text,mine=false)=>{const el=document.createElement('div');el.className='msg'+(mine?' mine':'');el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight};form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add(message,true);input.value='';try{const r=await fetch('/api/message',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({sessionId,name:document.querySelector('#name').value,contact:document.querySelector('#contact').value,message})});const data=await r.json();add(data.reply||'Обращение принято.')}catch{add('Не удалось отправить сообщение. Попробуйте ещё раз.')};};
</script></body></html>
