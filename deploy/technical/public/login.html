<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вход в CRM</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font:15px Arial;background:#f2f4f5;color:#252a2e}form{width:min(380px,100%);padding:28px;border-radius:12px;background:#fff;box-shadow:0 10px 30px #0002}h1{margin:0 0 8px;font-size:24px}p{color:#6c7479}.error{display:none;padding:10px;color:#9b2e17;background:#fff0eb}label{display:block;margin:14px 0 6px;font-weight:bold}input,button{width:100%;padding:12px;border-radius:7px;font-size:16px}input{border:1px solid #ccd2d5}button{margin-top:20px;border:0;color:#fff;background:#e25e25;font-weight:bold;cursor:pointer}</style></head><body><form method="post" action="/admin/login"><h1>Металлик CRM</h1><p>Вход администратора</p><p class="error" id="error">Неверный логин или пароль</p><label>Логин</label><input name="username" value="admin" required><label>Пароль</label><input name="password" type="password" required autofocus><button>Войти</button></form><script>if(location.search)document.querySelector('#error').style.display='block'</script></body></html>
